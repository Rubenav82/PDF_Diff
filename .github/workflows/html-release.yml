name: Release

on:
  push:
    tags: ['web*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Crear zips
        run: |
          VERSION=${{ github.ref_name }}
          zip -r pdfComparisonWebTool-$VERSION.zip ./dist
          cp pdfComparisonWebTool-$VERSION.zip pdfComparisonWebTool-latest.zip

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pdfComparisonWebTool-web*.zip
            pdfComparisonWebTool-latest.zip
