name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: npm run build

      - name: Crear zips
        run: |
          VERSION=${{ github.ref_name }}
          zip -r pdfComparisonWebTool-$VERSION.zip ./dist
          cp pdfComparisonWebTool-$VERSION.zip pdfComparisonWebTool-latest.zip

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pdfComparisonWebTool-v*.zip
            pdfComparisonWebTool-latest.zip
