name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write  # for npm provenance

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build core
        run: npm run build --workspace=packages/core

      - name: Build CLI
        run: npm run build --workspace=packages/cli

      - name: Generate fixtures for tests
        working-directory: packages/cli/fixtures
        run: node make-fixtures.cjs

      - name: Run CLI tests
        run: npm run test --workspace=packages/cli

      - name: Run SPA tests
        run: npm run test:run

      - name: Publish @pdf-diff/core
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view @pdf-diff/core@$VERSION version 2>/dev/null; then
            echo "core@$VERSION already published, skipping"
          else
            npm publish --access public --provenance
          fi

      - name: Publish @pdf-diff/cli
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view @pdf-diff/cli@$VERSION version 2>/dev/null; then
            echo "cli@$VERSION already published, skipping"
          else
            npm publish --access public --provenance
          fi
